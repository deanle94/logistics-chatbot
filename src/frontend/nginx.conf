# Serves the built React bundle and proxies the API on the same origin.
#
# One origin is the point: the browser never talks to :8000 directly, so there is no
# CORS configuration to get wrong here or in FastAPI, and the same bundle works
# unchanged behind any public hostname.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trailing slash on proxy_pass strips the /api prefix, so /api/health reaches the
    # backend as /health.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # Slice 2: /chat is Server-Sent Events. Buffered, its progress frames would all
        # arrive with the answer, which is the one thing progress frames must not do.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
